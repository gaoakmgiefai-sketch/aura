plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version + "." + System.currentTimeMillis()
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Здесь могут быть твои репозитории (например, maven для либ)
}

dependencies {
    // Указываем версии Minecraft, Yarn и Loader из файла gradle.properties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Если ты используешь Fabric API, раскомментируй строчку ниже:
    // modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    matchingFallbacks = [project.archives_base_name]

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21 // Для Minecraft 1.20.5+ / 1.21 используется Java 21
}

java {
    // Сборка источников для Java
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}"}
    }
}
